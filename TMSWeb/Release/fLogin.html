<html>
  <head>
    <meta http-equiv="Content-type" content="text/html; charset=utf-8" />
    <title>Login Chicken Flash</title>
    <style>
    </style>
  </head>
  <body>
  <div class="pagina">
  <main class="acceso">
    <section class="tarjeta" aria-labelledby="titulo">

      <div class="cabecera">
 <img src="Assets/logo-web.webp" alt="Chicken Flash" width="100" height="106">
 <link rel="preload" as="image" href="Assets/logo-web.webp">
  <h1 id="titulo" class="titulo">Iniciar Sesión</h1>
  <p class="sub">Ingresa con tu usuario y Contrase&ntilde;a para acceder al sistema.</p>
</div>

      <form class="form" onsubmit="return false">

        <div class="campo">
          <label for="edtUsuario">Usuario</label>
          <div class="caja">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
            <input id="edtUsuario" type="text" placeholder="Ingresa tu nombre de usuario"
                   autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
          </div>
        </div>

        <div class="campo">
          <div class="campo-fila">
            <label for="edtClave">Contrase&ntilde;a</label>
            <a class="enlace" id="lnkOlvide">¿Olvidaste tu Contrase&ntilde;a?</a>
          </div>
          <div class="caja caja--clave">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input id="edtClave" type="password" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;"
                   autocomplete="current-password">
            <button id="btnVer" type="button" class="ver" aria-label="Mostrar u ocultar Contrase&ntilde;a">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <p id="lblError" class="error" role="alert"></p>

        <button id="btnEntrar" type="submit" class="btn btn-primario">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
          <span>ENTRAR AL SISTEMA</span>
        </button>

        <button id="btnCrear" type="button" class="btn btn-secundario">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/>
            <line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/>
          </svg>
          <span>CREAR NUEVA CUENTA / REGISTRARSE</span>
        </button>

      </form>

      <div class="ayuda">Punto de venta e inventario Chicken Flash</div>
    </section>
  </main>

  <footer class="pie-pagina", id="footer">Chicken Flash • Sistema de Punto de Venta e Inventario </footer>
</div>
  </body>
</html>
