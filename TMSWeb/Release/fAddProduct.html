<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chicken Flash · Agregar producto</title>
<style></style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"></path></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"></path></symbol>
  <symbol id="i-cam" viewBox="0 0 24 24"><path d="M4 8h3l2-2h6l2 2h3a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2v-8a2 2 0 012-2z"></path><circle cx="12" cy="14" r="3.2"></circle></symbol>
</svg>

<div class="agr" id="divAgregar">

  <header class="top">
    <button class="back" id="btnAddVolver" type="button" aria-label="Volver a inventario">
      <svg class="i"><use href="#i-back"></use></svg>
    </button>
    <div class="who">
      <b>Agregar producto</b>
      <small>Chicken Flash · Nuevo en inventario</small>
    </div>
    <span class="net" id="lblAddRed">En línea</span>
  </header>

  <div class="card">

    <div class="fg">
      <label>Foto del producto (opcional)</label>
      <input id="edtAddFoto" type="file" accept="image/*" hidden>
      <button class="photo-drop" id="btnAddFoto" type="button">
        <span class="photo-ico"><svg class="i"><use href="#i-cam"></use></svg></span>
        <span class="photo-txt">
          <b>Agregar foto del producto</b>
          <small>Toca para tomar foto o elegir de galería</small>
        </span>
      </button>
      <div class="photo-prev" id="divAddFotoPrev" hidden>
        <img id="imgAddFoto" src alt="Vista previa del producto">
        <div class="photo-meta">
          <b>Foto seleccionada</b>
          <div class="photo-btns">
            <button class="p-btn" id="btnAddCambiarFoto" type="button">Cambiar foto</button>
            <button class="p-btn del" id="btnAddQuitarFoto" type="button">Quitar</button>
          </div>
        </div>
      </div>
    </div>

    <div class="fg">
      <label for="edtAddNombre">Nombre del producto</label>
      <input class="inp" id="edtAddNombre" type="text" placeholder="Ej. Pechuga de pollo, Arroz...">
    </div>

    <div class="fg">
      <label>Sección</label>
      <div class="seg sec" id="divAddSeccion"></div>
    </div>

    <div class="fg">
      <label>Forma de venta</label>
      <div class="seg c3">
        <button class="on" id="btnAddUniLb" type="button">Por libra</button>
        <button id="btnAddUniPaq" type="button">Por paquete</button>
        <button id="btnAddUniU" type="button">Por unidad</button>
      </div>
    </div>

    <div class="fg" id="divPaquete" hidden>
      <label for="edtLibras">Libras por paquete</label>
      <input class="inp" id="edtLibras" type="number" inputmode="decimal" min="0" step="any" placeholder="5">
      <div class="hints" id="divHints">
        <button type="button" data-h="2">2 lb</button>
        <button type="button" data-h="5">5 lb</button>
        <button type="button" data-h="10">10 lb</button>
      </div>
    </div>

    <div class="fg">
      <label for="edtAddNota">Nota (opcional)</label>
      <input class="inp" id="edtAddNota" type="text" placeholder="Ej. 1lb-950, 850+20">
    </div>

    <div class="fg">
      <label>Costos por unidad de venta (CUP)</label>
      <div class="row3">
        <div class="fg">
          <label for="edtAddCosto">Costo</label>
          <input class="inp" id="edtAddCosto" type="number" inputmode="decimal" min="0" step="any" placeholder="1900">
        </div>
        <div class="fg">
          <label for="edtAddExtra">Costo extra</label>
          <input class="inp" id="edtAddExtra" type="number" inputmode="decimal" min="0" step="any" placeholder="384">
        </div>
        <div class="fg">
          <label for="edtAddInsumo">Insumo</label>
          <input class="inp" id="edtAddInsumo" type="number" inputmode="decimal" min="0" step="any" placeholder="16">
        </div>
      </div>
    </div>

    <div class="row2">
      <div class="fg">
        <label for="edtAddPrecio">Precio de venta (CUP)</label>
        <input class="inp" id="edtAddPrecio" type="number" inputmode="decimal" min="1" step="any" placeholder="3000">
      </div>
      <div class="fg">
        <label for="edtAddStock">Stock inicial (<span id="lblUnidad">lb</span>)</label>
        <input class="inp" id="edtAddStock" type="number" inputmode="decimal" min="0" step="0.001" placeholder="20">
      </div>
    </div>

    <div class="calc">
      <div>
        <small>Costo total</small>
        <b id="lblAddCostoTotal">0 CUP</b>
      </div>
      <div>
        <small>Ganancia por unidad</small>
        <b class="ok" id="lblAddNeto">0 CUP</b>
      </div>
    </div>

    <div class="sw-row">
      <div>
        <b>Visible en tienda y vender</b>
        <small>Aparecerá de inmediato en el mostrador</small>
      </div>
      <button class="sw on" id="btnAddVisible" type="button" role="switch" aria-checked="true"></button>
    </div>

    <div class="err" id="lblAddError" hidden></div>

    <div class="actions">
      <button class="btn-save" id="btnAddGuardar" type="button">
        <svg class="i"><use href="#i-check"></use></svg>
        <span id="lblAddGuardar">Guardar producto</span>
      </button>
      <button class="btn-cancel" id="btnAddCancelar" type="button">Cancelar</button>
    </div>

  </div>

  <div class="toast" id="divAddToast" hidden>
    <svg class="i"><use href="#i-check"></use></svg>
    <span id="lblAddToast">Producto guardado en inventario</span>
  </div>

</div>
</body>
</html>
