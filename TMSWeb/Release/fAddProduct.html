<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chicken Flash · Agregar producto</title>
<style></style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"></path></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"></path></symbol>
  <symbol id="i-cam" viewBox="0 0 24 24"><path d="M4 8h3l2-2h6l2 2h3a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2v-8a2 2 0 012-2z"></path><circle cx="12" cy="14" r="3.2"></circle></symbol>
</svg>

<div class="agr" id="divAgregar">

  <header class="top">
    <button class="back" id="btnAddVolver" type="button" aria-label="Volver a inventario">
      <svg class="i"><use href="#i-back"></use></svg>
    </button>
    <div class="who">
      <b>Agregar producto</b>
      <small>Chicken Flash · Nuevo en inventario</small>
    </div>
    <span class="net" id="lblRed">En línea</span>
  </header>

  <div class="card">

    <div class="fg">
      <label>Foto del producto (opcional)</label>
      <input id="edtFoto" type="file" accept="image/*" hidden>
      <button class="photo-drop" id="btnFoto" type="button">
        <span class="photo-ico"><svg class="i"><use href="#i-cam"></use></svg></span>
        <span class="photo-txt">
          <b>Agregar foto del producto</b>
          <small>Toca para tomar foto o elegir de galería</small>
        </span>
      </button>
      <div class="photo-prev" id="divFotoPrev" hidden>
        <img id="imgFoto" src alt="Vista previa del producto">
        <div class="photo-meta">
          <b>Foto seleccionada</b>
          <div class="photo-btns">
            <button class="p-btn" id="btnCambiarFoto" type="button">Cambiar foto</button>
            <button class="p-btn del" id="btnQuitarFoto" type="button">Quitar</button>
          </div>
        </div>
      </div>
    </div>

    <div class="fg">
      <label for="edtNombre">Nombre del producto</label>
      <input class="inp" id="edtNombre" type="text" placeholder="Ej. Pechuga de pollo, Arroz...">
    </div>

    <div class="fg">
      <label>Sección</label>
      <div class="seg sec" id="divSeccion"></div>
    </div>

    <div class="fg">
      <label>Forma de venta</label>
      <div class="seg c2">
        <button class="on" id="btnUniLb" type="button">Por libra (lb)</button>
        <button id="btnUniPaq" type="button">Por paquete (paq)</button>
      </div>
    </div>

    <div class="fg">
      <label for="edtDetalle">Presentación / detalle</label>
      <input class="inp" id="edtDetalle" type="text" placeholder="Ej. Por libra o Paquete 5 lb">
      <div class="hints" id="divHints">
        <button type="button" data-h="Por libra">Por libra</button>
        <button type="button" data-h="Paquete 2 lb">Paquete 2 lb</button>
        <button type="button" data-h="Paquete 5 lb">Paquete 5 lb</button>
        <button type="button" data-h="Paquete 10 lb">Paquete 10 lb</button>
      </div>
    </div>

    <div class="row2">
      <div class="fg">
        <label for="edtPrecio">Precio (CUP)</label>
        <input class="inp" id="edtPrecio" type="number" inputmode="decimal" min="1" step="any" placeholder="450">
      </div>
      <div class="fg">
        <label for="edtStock">Stock inicial (<span id="lblUnidad">lb</span>)</label>
        <input class="inp" id="edtStock" type="number" inputmode="decimal" min="0" step="any" placeholder="20">
      </div>
    </div>

    <div class="sw-row">
      <div>
        <b>Visible en tienda y vender</b>
        <small>Aparecerá de inmediato en el mostrador</small>
      </div>
      <button class="sw on" id="btnVisible" type="button" role="switch" aria-checked="true"></button>
    </div>

    <div class="err" id="lblError" hidden></div>

    <div class="actions">
      <button class="btn-save" id="btnAddGuardar" type="button">
        <svg class="i"><use href="#i-check"></use></svg>
        <span id="lblGuardar">Guardar producto</span>
      </button>
      <button class="btn-cancel" id="btnAddCancelar" type="button">Cancelar</button>
    </div>

  </div>

  <div class="toast" id="divToast" hidden>
    <svg class="i"><use href="#i-check"></use></svg>
    <span id="lblToast">Producto guardado en inventario</span>
  </div>

</div>
</body>
</html>
