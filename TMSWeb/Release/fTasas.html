<div class="ts">
<div class="ts-app">
  <header class="ts-top">
    <button class="ts-back" id="tsAtras" type="button" aria-label="Atr&aacute;s"><svg class="ts-i" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="ts-av" id="lblInicial">J</div>
    <div class="ts-who">
      <b>Tasas de cambio</b>
      <small>Referencia elToque &middot; Mercado informal</small>
    </div>
  </header>

  <div class="ts-sync">
    <div class="ts-sync-meta">
      <small id="tsFuente">Fuente: elToque</small>
      <b id="tsHora">&mdash;</b>
    </div>
    <button class="ts-btn" id="tsBtn" type="button">
      <svg class="ts-i" viewBox="0 0 24 24"><path d="M21 12a9 9 0 00-15.5-6.3L3 8M3 3v5h5M3 12a9 9 0 0015.5 6.3L21 16M21 21v-5h-5"/></svg>Actualizar
    </button>
  </div>

  <section class="ts-rates">
    <!-- USD: ancho completo arriba -->
    <article class="ts-card ts-wide" id="tsCardUsd">
      <div class="ts-card-top">
        <span class="ts-tag"><span class="ts-dot usd">$</span>USD</span>
        <span class="ts-trend" id="tsTUsd" hidden></span>
      </div>
      <div class="ts-val" id="tsUsd">&mdash;</div>
      <div class="ts-sub">D&oacute;lar estadounidense</div>
      <div class="ts-nota" id="tsNotaUsd" hidden></div>
    </article>

    <!-- EUR: mitad -->
    <article class="ts-card" id="tsCardEur">
      <div class="ts-card-top">
        <span class="ts-tag"><span class="ts-dot eur">&euro;</span>EUR</span>
        <span class="ts-trend" id="tsTEur" hidden></span>
      </div>
      <div class="ts-val" id="tsEur">&mdash;</div>
      <div class="ts-sub">Euro</div>
      <div class="ts-nota" id="tsNotaEur" hidden></div>
    </article>

    <!-- MLC: mitad -->
    <article class="ts-card" id="tsCardMlc">
      <div class="ts-card-top">
        <span class="ts-tag"><span class="ts-dot mlc">M</span>MLC</span>
        <span class="ts-trend" id="tsTMlc" hidden></span>
      </div>
      <div class="ts-val" id="tsMlc">&mdash;</div>
      <div class="ts-sub">Moneda Libremente Convertible</div>
      <div class="ts-nota" id="tsNotaMlc" hidden></div>
    </article>
  </section>

  <section class="ts-calc">
    <div class="ts-calc-head"><b>Conversor r&aacute;pido</b><small>Equivalente en CUP</small></div>
    <div class="ts-calc-row">
      <input class="ts-inp" id="tsMonto" type="number" inputmode="decimal" min="0" step="any" value="10" aria-label="Monto en divisa">
    </div>
    <div class="ts-chips" id="tsChips">
      <button type="button" class="ts-chip sel" data-mon="usd">USD</button>
      <button type="button" class="ts-chip" data-mon="eur">EUR</button>
      <button type="button" class="ts-chip" data-mon="mlc">MLC</button>
    </div>
    <div class="ts-res"><span>Equivalente a</span><b id="tsRes">0 CUP</b></div>
  </section>

  <div class="ts-toast" id="tsToast" hidden>
    <svg class="ts-i" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg><span id="tsToastTxt"></span>
  </div>
</div>
</div>
