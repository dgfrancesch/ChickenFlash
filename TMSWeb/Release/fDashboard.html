<html>
  <head>
  <meta charset="UTF-8">
    <meta http-equiv="Content-type" content="text/html; charset=utf-8" />
    <title>Dashboard Chicken Flash</title>
    <style>
    </style>
  </head>
  <body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="ic-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></symbol>
  <symbol id="ic-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="ic-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="ic-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
  <symbol id="ic-cart" viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a1 1 0 001 .8h9.4a1 1 0 001-.8L21 7H6"/></symbol>
  <symbol id="ic-carne" viewBox="0 0 24 24"><circle cx="15" cy="9" r="5"/><path d="M11.5 12.5L5 19M4 17l3 3"/></symbol>
  <symbol id="ic-pez" viewBox="0 0 24 24"><path d="M2 12c3-5 8-6 13-3l5-3v12l-5-3c-5 3-10 2-13-3z"/><circle cx="7" cy="11" r=".6"/></symbol>
  <symbol id="ic-bolsa" viewBox="0 0 24 24"><path d="M6 8h12l1 12H5zM9 8a3 3 0 016 0"/></symbol>
</svg>

<div class="db" id="dashboard">

  <div class="db-wrap">
    <main class="db-main">
      <header class="db-top">
        <div class="db-av" id="lblInicial">J</div>
        <div class="db-quien"><b id="lblSaludo">Hola</b><small>Chicken Flash &bull; Administrador</small></div>
        <span class="db-red" id="lblRed">En l&iacute;nea</span>
      </header>

      <section class="db-kpis">
        <div class="db-kpi"><small>Ventas de hoy</small><b class="db-oro" id="lblVentasHoy">0 CUP</b></div>
        <div class="db-kpi"><small>Efectivo en caja</small><b id="lblEfectivoCaja">0 CUP</b></div>
      </section>

      <label class="db-buscar">
        <svg class="db-i"><use href="#ic-search"/></svg>
        <input id="edtBuscar" type="search" placeholder="Buscar producto" autocomplete="off">
      </label>

      <div class="db-filtros" id="divFiltros"></div>
      <div class="db-grid" id="divProductos"></div>
    </main>

    <aside class="db-dock" id="pnlVenta" data-vacia="true">
      <section class="db-venta">
        <div class="db-venta-cab">
          <span><svg class="db-i"><use href="#ic-cart"/></svg><b id="lblVentaTitulo">Venta actual</b></span>
          <button id="btnVaciar" type="button">Vaciar</button>
        </div>
        <p class="db-venta-hint" id="lblVentaAviso"></p>
        <div class="db-venta-lista" id="divVenta"></div>
        <p class="db-vacio">Toca un producto para agregarlo a la venta.</p>
      </section>
      <div class="db-total">
        <div><small>Total a cobrar</small><b id="lblTotal">0 CUP</b></div>
        <button id="btnCobrar" type="button">Cobrar</button>
      </div>
    </aside>
  </div>

  <!-- Moldes: la lógica los clona y solo rellena textos y data-* -->
  <template id="tplFiltro">
    <button class="db-chip" type="button" data-seccion=""></button>
  </template>

  <template id="tplProducto">
    <article class="db-prod" data-id="">
      <div class="db-ph" data-tono="1">
        <img class="db-foto" alt="" hidden>
        <svg class="db-i"><use href="#ic-bolsa"/></svg>
        <span class="db-un"></span>
      </div>
      <div class="db-pb">
        <h3 class="db-nombre"></h3>
        <p class="db-detalle"></p>
        <span class="db-stock"></span>
        <p class="db-precio"></p>
        <div class="db-ctl"></div>
      </div>
    </article>
  </template>

  <template id="tplAgregar">
    <button class="db-add" type="button" data-accion="mas"><svg class="db-i"><use href="#ic-cart"/></svg>Agregar</button>
  </template>

  <template id="tplCantidad">
    <div class="db-pill">
      <button class="db-rb" type="button" data-accion="menos" aria-label="Quitar"><svg class="db-i"><use href="#ic-minus"/></svg></button>
      <input class="db-q" type="text" inputmode="decimal" data-accion="cantidad" aria-label="Cantidad">
      <button class="db-rb db-rb--g" type="button" data-accion="mas" aria-label="Agregar"><svg class="db-i"><use href="#ic-plus"/></svg></button>
    </div>
  </template>

  <template id="tplLinea">
    <div class="db-linea" data-id="">
      <div class="db-linea-n"><b class="db-nombre"></b><small class="db-subtotal"></small></div>
      <div class="db-ctl"></div>
      <button class="db-del" type="button" data-accion="quitar" aria-label="Quitar de la venta"><svg class="db-i"><use href="#ic-trash"/></svg></button>
    </div>
  </template>

</div>
  </body>
</html>
